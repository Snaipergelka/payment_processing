[tool.poetry]
name = "payment-processing"
version = "1.0.0"
description = "Asynchronous payment processing microservice (FastAPI + FastStream + Outbox pattern)"
authors = ["Angelina <sheiko.angelina0@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "0.115.6"
uvicorn = { extras = ["standard"], version = "0.34.0" }
pydantic = "2.10.4"
pydantic-settings = "2.7.1"
sqlalchemy = { extras = ["asyncio"], version = "2.0.36" }
asyncpg = "0.30.0"
alembic = "1.14.0"
faststream = { extras = ["rabbit", "cli"], version = "0.5.34" }
aio-pika = ">=9.4,<10"
httpx = "0.28.1"
python-dotenv = "1.0.1"
tenacity = "9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.25.0"
ruff = "0.8.4"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
